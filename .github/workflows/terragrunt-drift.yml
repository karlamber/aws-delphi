# Weekly speculative plan of every unit, using the plan role.
# A non-empty plan opens or updates an issue and fails the job. The workflow
# does not apply. Apply drift by running Terragrunt apply manually with
# reconcile set to true, after you have read the plan.
#
# Clone setup: the same dev-plan and prod-plan environments the pull request
# plan uses. The schedule stays red until those environments and the state
# bucket exist.

name: Terragrunt drift

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      environment:
        description: Account to plan
        type: choice
        default: both
        options:
          - dev
          - prod
          - both

permissions:
  contents: read

jobs:
  drift:
    name: Drift ${{ matrix.env }}
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.environment == 'both' ||
        inputs.environment == matrix.env
      )
    runs-on: ubuntu-latest
    environment: ${{ matrix.github_environment }}
    permissions:
      id-token: write
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: dev
            account_dir: aws-delphi-dev
            github_environment: dev-plan
          - env: prod
            account_dir: aws-delphi-prod
            github_environment: prod-plan
    env:
      ACCOUNT_ENV: ${{ matrix.env }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ROUTE53_ACCOUNT_ID: ${{ vars.ROUTE53_ACCOUNT_ID }}
      DNS_MANAGER_ROLE_ARN: ${{ vars.DNS_MANAGER_ROLE_ARN }}
      APP_OIDC_SUBJECTS: ${{ vars.APP_OIDC_SUBJECTS }}
      IAC_PLAN_OIDC_SUBJECT: ${{ vars.IAC_PLAN_OIDC_SUBJECT }}
      IAC_APPLY_OIDC_SUBJECT: ${{ vars.IAC_APPLY_OIDC_SUBJECT }}
      IAC_APPLY_JOB_WORKFLOW_REF: ${{ vars.IAC_APPLY_JOB_WORKFLOW_REF }}
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Read tool versions
        id: versions
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source .github/terraform-versions.env
          set +a
          echo "terraform_version=$TERRAFORM_VERSION" >> "$GITHUB_OUTPUT"
          echo "terragrunt_version=$TERRAGRUNT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Terraform and Terragrunt
        uses: ./.github/actions/setup-iac
        with:
          terraform_version: ${{ steps.versions.outputs.terraform_version }}
          terragrunt_version: ${{ steps.versions.outputs.terragrunt_version }}

      - name: Write account.hcl from environment variables
        run: .github/scripts/render-account-hcl.sh "${{ matrix.account_dir }}"

      - name: Read the region
        id: region
        run: |
          set -euo pipefail
          region_file="$(find "${{ matrix.account_dir }}" -name region.hcl -print -quit)"
          region="$(sed -n 's/^[[:space:]]*region[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$region_file")"
          if [ -z "$region" ]; then
            echo "No region found in $region_file. This workflow expects one region.hcl per account." >&2
            exit 1
          fi
          echo "name=$region" >> "$GITHUB_OUTPUT"

      - name: Assume the plan role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ steps.region.outputs.name }}
          role-session-name: gha-terragrunt-drift-${{ matrix.env }}
          mask-aws-account-id: false

      - name: Plan every unit
        run: .github/scripts/run-terragrunt.sh drift "${{ matrix.account_dir }}"

      - name: Summarize the plan
        id: summary
        run: |
          set -euo pipefail
          python3 .github/scripts/summarize-plan.py plan.txt | tee summary.txt
          {
            echo "status=$(head -n 1 summary.txt)"
            echo "detail<<EOF"
            tail -n +2 summary.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or close the drift issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ACCOUNT_ENV: ${{ matrix.env }}
          DRIFT_STATUS: ${{ steps.summary.outputs.status }}
          DRIFT_DETAIL: ${{ steps.summary.outputs.detail }}
        with:
          script: |
            const { owner, repo } = context.repo
            const title = `Terragrunt drift: ${process.env.ACCOUNT_ENV}`
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            })
            const existing = issues.find((issue) => issue.title === title)
            if (process.env.DRIFT_STATUS === 'clean') {
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `The scheduled plan matches main. ${runUrl}`,
                })
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, state: 'closed',
                })
              }
              return
            }
            const body = [
              `The plan of \`${process.env.ACCOUNT_ENV}\` on main is not empty.`,
              '',
              process.env.DRIFT_DETAIL,
              '',
              `Run: ${runUrl}`,
              '',
              'This workflow does not apply. After reading the plan, run the Terragrunt apply workflow manually with reconcile set to true if the drift should be corrected from main.',
            ].join('\n')
            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, body,
              })
            } else {
              await github.rest.issues.create({
                owner, repo, title, body,
              })
            }

      - name: Fail the job when the account has drifted
        if: steps.summary.outputs.status == 'drift'
        run: exit 1
