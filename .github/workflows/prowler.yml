name: Prowler

on:
  workflow_dispatch:
    inputs:
      role_arn:
        description: ARN of role-delphi-dev-ue1-github_oidc_readonly
        required: true
        type: string
      aws_region:
        description: Region to scan
        required: true
        default: us-east-1
        type: string

permissions:
  contents: read

jobs:
  scan:
    name: Account scan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # id-token lets this job assume the read-only role. actions: write stores the report.
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Reject any role except the dev read-only role
        env:
          ROLE_ARN: ${{ inputs.role_arn }}
        run: |
          set -euo pipefail
          if [[ ! "$ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/role-delphi-dev-ue1-github_oidc_readonly$ ]]; then
            echo "Refusing to assume a role other than role-delphi-dev-ue1-github_oidc_readonly."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: prowler

      - name: Install Prowler
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/prowler"
          "${RUNNER_TEMP}/prowler/bin/pip" install --disable-pip-version-check 'prowler==5.45.0'

      # Exit 3 means the scan finished and the report contains findings.
      # That is the evidence. It is not a merge gate.
      - name: Scan the dev account
        run: |
          set +e
          "${RUNNER_TEMP}/prowler/bin/prowler" aws \
            --output-formats csv html \
            --output-directory prowler-output \
            --output-filename prowler
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            exit "$status"
          fi
          echo "Scan finished with exit ${status}. Exit 3 means the report contains findings."

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prowler-dev
          path: prowler-output/
          if-no-files-found: warn
